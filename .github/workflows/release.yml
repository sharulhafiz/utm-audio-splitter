name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2026.07.29)"
        required: true

permissions:
  contents: write

jobs:
  version:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      clean: ${{ steps.ver.outputs.clean }}
    steps:
      - name: Sanitize version
        id: ver
        run: |
          RAW="${{ github.ref_name }}"
          CLEAN="${RAW#v}"
          VERSION="${CLEAN%%-*}"
          echo "clean=$VERSION" >> $GITHUB_OUTPUT

  build:
    name: "Build ${{ matrix.target }}"
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            ext: ".exe"
          - os: macos-latest
            target: mac
            ext: ".dmg"
          - os: ubuntu-latest
            target: linux
            ext: ".AppImage"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (${{ matrix.target }})
        run: |
          VERSION="${{ needs.version.outputs.clean }}"
          case "${{ matrix.target }}" in
            win)   npx electron-builder --win portable   --config.extraMetadata.version="$VERSION" -p never ;;
            mac)   npx electron-builder --mac dmg        --config.extraMetadata.version="$VERSION" -p never ;;
            linux) npx electron-builder --linux AppImage --config.extraMetadata.version="$VERSION" -p never ;;
          esac

      - name: Upload (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: UTM-Audio-Splitter-${{ matrix.target }}
          path: dist/*${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -ls

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "UTM Audio Splitter ${{ github.ref_name }}"
          body: |
            ## UTM Audio Splitter ${{ github.ref_name }}

            ### 📦 Downloads

            | Platform | File |
            |----------|------|
            | 🪟 Windows | `UTM-Audio-Splitter-Windows.exe` (portable) |
            | 🍎 macOS   | `UTM-Audio-Splitter-macOS.dmg` |
            | 🐧 Linux   | `UTM-Audio-Splitter-Linux.AppImage` |

            ### 🚀 How to use
            - **Windows**: Download `.exe` and double-click
            - **macOS**: Download `.dmg`, open, drag to Applications
            - **Linux**: Download `.AppImage`, `chmod +x` and run

            No installation or dependencies required.
          files: |
            artifacts/*/*
          draft: false
          prerelease: false
